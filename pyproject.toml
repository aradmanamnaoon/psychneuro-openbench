[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "psychneuro-openbench"
version = "0.1.0.dev0"
description = "Nonclinical synthetic behavioral ML benchmark foundations"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PsychNeuro OpenBench contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.12,<2"]
parquet = ["pyarrow>=17"]
benchmark = ["scikit-learn>=1.5,<2"]
ui = ["streamlit>=1.65,<2", "altair>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
psychneuro = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
