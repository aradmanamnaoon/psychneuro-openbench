<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc"><title id="title">Group-aware evaluation research design</title><desc id="desc">Conceptual diagram showing source checks followed by separate training and test participant groups, matched baseline comparisons and recorded provenance. This is a design protocol and not a measured result.</desc>
