# PRIVATE single-host CPU-only demonstration; no public bind.
services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    env_file:
      - .env
    environment:
      W04_DB_PATH: /var/lib/psychneuro/aggregate.sqlite
      W04_REGISTRY_PATH: /opt/psychneuro/data/registry.json
    ports:
      - "127.0.0.1:18080:8000"
    volumes:
      - w04_data:/var/lib/psychneuro
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 20s
volumes:
  w04_data: {}
