name: W03 private synthetic-engine review (manual opt-in)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Private W03 dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,benchmark,w03]'
      - name: P1/P13 source/tests (including old regression tests)
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Strict typing
        run: python -m mypy src
      - name: Environment provenance
        run: |
          echo "commit=${GITHUB_SHA}"
          python --version
          python -m pip freeze --disable-pip-version-check
