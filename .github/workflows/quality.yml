name: PM-02 Python quality checks (manual; quota approval required)

# Private repositories can consume billable Actions minutes.
# Manual-only until a reviewer checks remaining included minutes and approves.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test and build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -q
      - name: Ruff static checks
        run: ruff check .
      - name: Mypy type checks
        run: mypy src
      - name: Validate package build
        run: python -m build
