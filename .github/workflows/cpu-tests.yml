# PM-03: staged on feature branch; NOT executed or verified.
# Runs only after a PR is explicitly authorized or a manual dispatch is
# possible on the repository default branch. Do not infer CI success from YAML.
name: CPU tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-contract:
    name: Synthetic contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install editable project and pytest
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Run actual generator tests
        run: python -m pytest -q tests/test_synthetic.py
