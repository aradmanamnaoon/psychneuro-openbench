# One-off run, explicitly authorized by owner on 2026-10-16.
# A single CPU job, GitHub Actions hard timeout of four runner minutes.
# Only this temporary verification branch can trigger it.
name: PM-04 final private verification
on:
  push:
    branches: [ci/pm04-final-verification]
permissions:
  contents: read
concurrency:
  group: pm04-final-one-off
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/ci/pm04-final-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run complete tests
        run: python -m pytest -q
      - name: Enforce Ruff
        run: python -m ruff check .
      - name: Enforce strict mypy
        run: python -m mypy src
