# PM-03 enhancement of PM-02's existing workflow.
# Manual only: no automatic private-runner minutes / PR trigger.
name: Synthetic CPU quality gates (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test, lint and type-check dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run all generator contract tests
        run: python -m pytest -q
      - name: Lint Python
        run: python -m ruff check .
      - name: Type check typed package
        run: python -m mypy src
