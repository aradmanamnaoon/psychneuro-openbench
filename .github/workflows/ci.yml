# Manual-only to avoid unattended use of private GitHub Actions minutes.
# Never claim PM-06 validation before reviewing a run for the exact commit.
name: Synthetic and loader CPU quality gates (manual only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development requirements
        run: python -m pip install --disable-pip-version-check -e '.[dev,parquet]'
      - name: Run generator, loader and Parquet tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Strict typing
        run: python -m mypy src
      - name: Execute synthetic-only PM-06 exploration
        run: |
          python -m psychneuro.explore --seed 73 --participants 12 --trials-per-participant 20 --registry data/registry.json --output-dir artifacts/pm06
      - name: Print exact-code and artifact audit evidence
        run: |
          echo "Git commit: ${GITHUB_SHA}"
          python --version
          python -m pip freeze --disable-pip-version-check
          sha256sum artifacts/pm06/*.json artifacts/pm06/*.csv artifacts/pm06/*.svg
          cat artifacts/pm06/manifest.json
      - name: Save PM-06 exploration and provenance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pm06-synthetic-pilot-${{ matrix.python-version }}
          path: artifacts/pm06/
          retention-days: 7
          if-no-files-found: error
