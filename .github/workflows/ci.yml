name: PM-04 one-off private schema audit
on:
  push:
    branches: [ci/pm04-schema-audit]
permissions:
  contents: read
concurrency:
  group: pm04-one-off
  cancel-in-progress: true
jobs:
  test:
    if: github.ref == 'refs/heads/ci/pm04-schema-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test and analysis dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run all source validation tests
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy src
