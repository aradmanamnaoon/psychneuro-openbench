# Manual-only to avoid unattended use of private GitHub Actions minutes.
# PM-06 through PM-10 code is NOT validated until the exact branch and run logs are inspected.
name: Synthetic and loader CPU quality gates (manual only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development requirements
        run: python -m pip install --disable-pip-version-check -e '.[dev,parquet,benchmark]'
      - name: Run generator, loader and Parquet tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Strict typing
        run: python -m mypy src
      - name: Execute synthetic-only PM-06 exploration
        run: |
          python -m psychneuro.explore --seed 73 --participants 12 --trials-per-participant 20 --registry data/registry.json --output-dir artifacts/pm06
      - name: Execute PM-08 grouped synthetic benchmark
        run: |
          python -m psychneuro.experiments --config configs/baseline.json --registry data/registry.json --output-dir artifacts/pm08
      - name: Display PM-09 versioned configuration and manifest evidence
        run: |
          sha256sum configs/baseline.json artifacts/pm08/manifest.json
          cat artifacts/pm08/manifest.json
      - name: Execute PM-10 predeclared synthetic repeated pipeline
        run: |
          python -m psychneuro.pipeline --config configs/baseline.json --registry data/registry.json --repeats 5 --output-dir artifacts/pm10
      - name: Print PM-10 synthetic-only report and checksum
        run: |
          sha256sum artifacts/pm10/report.json
          cat artifacts/pm10/report.json
      - name: Archive guarded PM-10 repeat summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pm10-synthetic-repeat-${{ matrix.python-version }}
          path: artifacts/pm10/report.json
          retention-days: 7
          if-no-files-found: error
      - name: Archive synthetic-only PM-08 experiment manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pm08-benchmark-${{ matrix.python-version }}
          path: artifacts/pm08/manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Print exact-code and artifact audit evidence
        run: |
          echo "Git commit: ${GITHUB_SHA}"
          python --version
          python -m pip freeze --disable-pip-version-check
          sha256sum artifacts/pm06/*.json artifacts/pm06/*.csv artifacts/pm06/*.svg
          cat artifacts/pm06/manifest.json
      - name: Save PM-06 exploration and provenance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pm06-synthetic-pilot-${{ matrix.python-version }}
          path: artifacts/pm06/
          retention-days: 7
          if-no-files-found: error
